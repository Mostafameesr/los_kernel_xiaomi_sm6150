name: TIPC Groups final guarded hardening

on:
  push:
    branches:
      - TIPC_GROUPS

permissions:
  contents: write

concurrency:
  group: tipc-groups-hardening-${{ github.repository }}
  cancel-in-progress: false

env:
  TARGET_BRANCH: TIPC_GROUPS
  UPSTREAM_REPO: https://github.com/torvalds/linux.git

jobs:
  harden:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: TIPC_GROUPS
          fetch-depth: 0
          persist-credentials: true

      - name: Guard branch and stable
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git branch --show-current)" == "$TARGET_BRANCH" ]]
          git fetch --no-tags origin stable "$TARGET_BRANCH"
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "stable=$(git rev-parse refs/remotes/origin/stable)" >> "$GITHUB_OUTPUT"
          grep -q 'skb_queue_empty_lockless' net/tipc/socket.c
          grep -Eq '#define[[:space:]]+TIPC_GROUP_JOIN[[:space:]]+135' include/uapi/linux/tipc.h
          grep -Eq '#define[[:space:]]+TIPC_GROUP_LEAVE[[:space:]]+136' include/uapi/linux/tipc.h

      - name: Configure git and upstream
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config commit.gpgsign false
          git remote add upstream "$UPSTREAM_REPO" 2>/dev/null || git remote set-url upstream "$UPSTREAM_REPO"

      - name: Apply seven pre-refactor correctness fixes
        shell: bash
        run: |
          set -euo pipefail
          FIXES=(
            234833991e14681f61cbfd93e65a5c976089cf11
            3f42f5fe31c8715a34064bfd7b788488d1ea2f7c
            3db096011722fd8717e57687ae94b6917a11c9cc
            bb25c3855a12cc58e33cd7ee9b69943790fe35f7
            0a3d805c9c503e05d6e5d3868c53e92a06589dcf
            3a33a19bf88cdfc6d982972bc6ffcf7a62c1015e
            f9c935db8086231a35b7f5c2a53e3f1e10f388ee
          )
          for c in "${FIXES[@]}"; do
            git fetch --no-tags upstream "$c"
            subject="$(git show -s --format=%s "$c")"
            if git log --format=%s | grep -Fqx "$subject"; then
              echo "already present: $subject"
              continue
            fi
            if ! git cherry-pick -x "$c"; then
              git status --short
              git cherry-pick --abort || true
              echo "::error::Conflict in reviewed fix $c; refusing manual guess"
              exit 1
            fi
          done

      - name: Apply safety and lifetime adaptations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          sp = Path('net/tipc/socket.c')
          gp = Path('net/tipc/group.c')
          hp = Path('net/tipc/group.h')
          vp = Path('net/tipc/server.c')
          s, g, h, v = sp.read_text(), gp.read_text(), hp.read_text(), vp.read_text()

          def one(text, old, new, label):
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {n}')
              return text.replace(old, new, 1)

          # c75e427d: ERR_PTR handling in topology subscription.
          old = '\tcon = tipc_alloc_conn(tipc_topsrv(net));\n\tif (!con)\n\t\treturn false;\n\n\t*conid = con->conid;\n'
          new = '\tcon = tipc_alloc_conn(tipc_topsrv(net));\n\tif (IS_ERR(con))\n\t\treturn false;\n\n\t*conid = con->conid;\n'
          if new not in v:
              v = one(v, old, new, 'server ERR_PTR')

          # 777ecaab: fully initialize usr_handle.
          old = '\t*(u32 *)&sub.usr_handle = port;\n'
          new = '\t*(u64 *)&sub.usr_handle = (u64)port;\n'
          if new not in v:
              v = one(v, old, new, 'usr_handle')

          # 5cf02612: deferred queue purge on whole-group teardown.
          old = '\t\ttipc_group_proto_xmit(grp, m, GRP_LEAVE_MSG, &xmitq);\n\t\tlist_del(&m->list);\n'
          new = '\t\ttipc_group_proto_xmit(grp, m, GRP_LEAVE_MSG, &xmitq);\n\t\t__skb_queue_purge(&m->deferredq);\n\t\tlist_del(&m->list);\n'
          if new not in g:
              g = one(g, old, new, 'deferredq purge')

          # bb3a420d: duplicate RB key must fail before member_cnt/dests update.
          if 'static void tipc_group_add_to_tree' in g:
              st = g.index('static void tipc_group_add_to_tree')
              en = g.index('\n}\n\nstatic struct tipc_member *tipc_group_create_member', st) + 3
              fn = g[st:en]
              fn = fn.replace('static void tipc_group_add_to_tree', 'static int tipc_group_add_to_tree', 1)
              fn = one(fn, '\t\telse\n\t\t\treturn;\n', '\t\telse\n\t\t\treturn -EEXIST;\n', 'duplicate RB return')
              fn = one(fn, '\trb_insert_color(&m->tree_node, &grp->members);\n}', '\trb_insert_color(&m->tree_node, &grp->members);\n\treturn 0;\n}', 'RB success return')
              g = g[:st] + fn + g[en:]

          st = g.index('static struct tipc_member *tipc_group_create_member')
          en = g.index('\n}\n\nvoid tipc_group_add_member', st) + 3
          cm = g[st:en]
          if 'ret = tipc_group_add_to_tree(grp, m);' not in cm:
              cm = one(cm, '\tstruct tipc_member *m;\n', '\tstruct tipc_member *m;\n\tint ret;\n', 'create member ret')
              old = '\tm->bc_acked = grp->bc_snd_nxt - 1;\n\tgrp->member_cnt++;\n\ttipc_group_add_to_tree(grp, m);\n'
              new = '\tm->bc_acked = grp->bc_snd_nxt - 1;\n\tret = tipc_group_add_to_tree(grp, m);\n\tif (ret < 0) {\n\t\tkfree(m);\n\t\treturn NULL;\n\t}\n\tgrp->member_cnt++;\n'
              cm = one(cm, old, new, 'create member insert')
              g = g[:st] + cm + g[en:]

          # 48a5fe38: ignore duplicate/stale GRP_ACK_MSG before decrement.
          st = g.index('void tipc_group_proto_rcv(')
          en = g.index('\n}\n\n/* tipc_group_member_evt', st) + 3
          pr = g[st:en]
          if 'acked = msg_grp_bc_acked(hdr);' not in pr:
              pr = one(pr, '\tu16 remitted, in_flight;\n', '\tu16 remitted, in_flight;\n\tu16 acked;\n', 'ACK variable')
              old = '\t\tm->bc_acked = msg_grp_bc_acked(hdr);\n\t\tif (--grp->bc_ackers)\n\t\t\tbreak;\n'
              new = '\t\tacked = msg_grp_bc_acked(hdr);\n\t\tif (less_eq(acked, m->bc_acked))\n\t\t\treturn;\n\t\tm->bc_acked = acked;\n\t\tif (--grp->bc_ackers)\n\t\t\tbreak;\n'
              pr = one(pr, old, new, 'duplicate ACK')
              g = g[:st] + pr + g[en:]

          # 143ece: unicast live group check across tipc_wait_for_cond().
          st = s.index('static int tipc_send_group_unicast(')
          en = s.index('\n}\n', st) + 3
          fn = s[st:en]
          if 'struct tipc_group *grp = tsk->group;' in fn:
              fn = fn.replace('\tstruct tipc_group *grp = tsk->group;\n', '', 1)
          old = '\t\t\t\t!tipc_group_cong(grp, node, port, blks, &mb));\n'
          new = '\t\t\t\ttsk->group &&\n\t\t\t\t!tipc_group_cong(tsk->group, node, port, blks, &mb));\n'
          if old in fn:
              fn = one(fn, old, new, 'unicast wait')
          if 'tsk->group &&' not in fn:
              raise SystemExit('unicast live group check absent')
          s = s[:st] + fn + s[en:]

          # 143ece: anycast live group reload/check, scoped only to anycast.
          st = s.index('static int tipc_send_group_anycast(')
          en = s.index('\n}\n', st) + 3
          fn = s[st:en]
          if 'struct tipc_group *grp = tsk->group;' in fn:
              fn = fn.replace('\tstruct tipc_group *grp = tsk->group;\n', '', 1)
          old = '\tdomain = addr_domain(net, dest->scope);\n\texclude = tipc_group_exclude(grp);\n\n\twhile (++lookups < 4) {\n'
          new = '\tdomain = addr_domain(net, dest->scope);\n\n\twhile (++lookups < 4) {\n\t\texclude = tipc_group_exclude(tsk->group);\n\n'
          if old in fn:
              fn = one(fn, old, new, 'anycast exclude')
          if 'tipc_group_cong(grp, node, port, blks, &mbr)' in fn:
              fn = fn.replace('tipc_group_cong(grp, node, port, blks, &mbr)', 'tipc_group_cong(tsk->group, node, port, blks, &mbr)', 1)
          old = '\t\t\t\t\t!tipc_group_cong(grp, node, port,\n\t\t\t\t\t\t\t blks, &mbr));\n'
          new = '\t\t\t\t\ttsk->group &&\n\t\t\t\t\t!tipc_group_cong(tsk->group, node, port,\n\t\t\t\t\t\t\t blks, &mbr));\n'
          if old in fn:
              fn = one(fn, old, new, 'anycast wait')
          if 'exclude = tipc_group_exclude(tsk->group);' not in fn or 'tsk->group &&' not in fn:
              raise SystemExit('anycast live group adaptation absent')
          s = s[:st] + fn + s[en:]

          # 143ece + 3c6306: broadcast group/dests are reloaded after wait.
          st = s.index('static int tipc_send_group_bcast(')
          en = s.index('\n}\n', st) + 3
          fn = s[st:en]
          fn = fn.replace('\tstruct tipc_group *grp = tsk->group;\n', '', 1)
          if 'struct tipc_nlist *dsts = tipc_group_dests(grp);' in fn:
              fn = fn.replace('\tstruct tipc_nlist *dsts = tipc_group_dests(grp);\n', '\tstruct tipc_nlist *dsts;\n', 1)
          old = '\tif (!dsts->local && !dsts->remote)\n\t\treturn -EHOSTUNREACH;\n\n\t/* Block or return if any destination link or member is congested */\n\trc = tipc_wait_for_cond(sock, &timeout,\t!tsk->cong_link_cnt &&\n\t\t\t\t!tipc_group_bc_cong(grp, blks));\n\tif (unlikely(rc))\n\t\treturn rc;\n\n'
          new = '\t/* Block or return if any destination link or member is congested */\n\trc = tipc_wait_for_cond(sock, &timeout,\n\t\t\t\t!tsk->cong_link_cnt && tsk->group &&\n\t\t\t\t!tipc_group_bc_cong(tsk->group, blks));\n\tif (unlikely(rc))\n\t\treturn rc;\n\n\tdsts = tipc_group_dests(tsk->group);\n\tif (!dsts->local && !dsts->remote)\n\t\treturn -EHOSTUNREACH;\n\n'
          if old in fn:
              fn = one(fn, old, new, 'broadcast wait/dests')
          fn = fn.replace('tipc_group_bc_snd_nxt(grp)', 'tipc_group_bc_snd_nxt(tsk->group)')
          if 'dsts = tipc_group_dests(tsk->group);' not in fn or 'tsk->group &&' not in fn:
              raise SystemExit('broadcast live group/dests adaptation absent')
          s = s[:st] + fn + s[en:]

          # 60c253 + 1b22 semantics: poll-safe readiness state lives in tipc_sock.
          if 'bool group_is_open;' not in s:
              s = one(s, '\tstruct tipc_group *group;\n', '\tstruct tipc_group *group;\n\tbool group_is_open;\t/* poll-safe group write readiness */\n', 'sock open flag')
          if '\ttsk->group_is_open = true;\n' not in s:
              s = one(s, '\ttsk->conn_timeout = CONN_TIMEOUT_DEFAULT;\n\tatomic_set(&tsk->dupl_rcvcnt, 0);\n', '\ttsk->conn_timeout = CONN_TIMEOUT_DEFAULT;\n\ttsk->group_is_open = true;\n\tatomic_set(&tsk->dupl_rcvcnt, 0);\n', 'open init')

          st = s.index('static unsigned int tipc_poll(')
          en = s.index('\n}\n', st) + 3
          fn = s[st:en]
          fn = fn.replace('\tstruct tipc_group *grp = tsk->group;\n', '', 1)
          old = '\tcase TIPC_OPEN:\n\t\tif (!grp || tipc_group_size(grp))\n\t\t\tif (!tsk->cong_link_cnt)\n\t\t\t\trevents |= POLLOUT;\n'
          new = '\tcase TIPC_OPEN:\n\t\tif (READ_ONCE(tsk->group_is_open) && !tsk->cong_link_cnt)\n\t\t\trevents |= POLLOUT;\n'
          if old in fn:
              fn = one(fn, old, new, 'poll readiness')
          if 'READ_ONCE(tsk->group_is_open)' not in fn or 'tipc_group_size(grp)' in fn:
              raise SystemExit('poll adaptation absent')
          s = s[:st] + fn + s[en:]

          old = 'grp = tipc_group_create(net, tsk->portid, mreq);'
          new = 'grp = tipc_group_create(net, tsk->portid, mreq,\n\t\t\t\t&tsk->group_is_open);'
          if old in s:
              s = one(s, old, new, 'group create call')

          old = '\tif (rc) {\n\t\ttipc_group_delete(net, grp);\n\t\ttsk->group = NULL;\n\t}\n'
          new = '\tif (rc) {\n\t\ttipc_group_delete(net, grp);\n\t\ttsk->group = NULL;\n\t\tWRITE_ONCE(tsk->group_is_open, true);\n\t}\n'
          if old in s:
              s = one(s, old, new, 'failed join readiness')

          old = '\ttipc_group_delete(net, grp);\n\ttsk->group = NULL;\n\ttipc_sk_withdraw(tsk, scope, &seq);\n'
          new = '\ttipc_group_delete(net, grp);\n\ttsk->group = NULL;\n\tWRITE_ONCE(tsk->group_is_open, true);\n\ttipc_sk_withdraw(tsk, scope, &seq);\n'
          if old in s:
              s = one(s, old, new, 'leave readiness')

          old = 'struct tipc_group *tipc_group_create(struct net *net, u32 portid,\n\t\t\t\t     struct tipc_group_req *mreq);'
          new = 'struct tipc_group *tipc_group_create(struct net *net, u32 portid,\n\t\t\t\t     struct tipc_group_req *mreq,\n\t\t\t\t     bool *group_is_open);'
          if old in h:
              h = one(h, old, new, 'group.h signature')

          if 'bool *open;' not in g:
              g = one(g, '\tu16 bc_ackers;\n', '\tu16 bc_ackers;\n\tbool *open;\t\t/* readiness lives in struct tipc_sock */\n', 'group open pointer')
          old = 'struct tipc_group *tipc_group_create(struct net *net, u32 portid,\n\t\t\t\t     struct tipc_group_req *mreq)'
          new = 'struct tipc_group *tipc_group_create(struct net *net, u32 portid,\n\t\t\t\t     struct tipc_group_req *mreq,\n\t\t\t\t     bool *group_is_open)'
          if old in g:
              g = one(g, old, new, 'group.c signature')
          if '\tgrp->open = group_is_open;\n' not in g:
              g = one(g, '\tgrp->events = mreq->flags & TIPC_GROUP_MEMBER_EVTS;\n', '\tgrp->events = mreq->flags & TIPC_GROUP_MEMBER_EVTS;\n\tgrp->open = group_is_open;\n', 'open pointer assign')

          if 'WRITE_ONCE(*grp->open, false);\n\t\treturn grp;' not in g:
              pat = re.compile(r'(\tif \(tipc_topsrv_kern_subscr\([^\n]*\)\)\n)(\t\treturn grp;)')
              m = pat.search(g)
              if not m:
                  raise SystemExit('topology subscription success anchor absent')
              g = g[:m.start()] + m.group(1) + '\t\tWRITE_ONCE(*grp->open, false);\n' + m.group(2) + g[m.end():]

          # Insert readiness transitions in the exact create/delete member functions.
          st = g.index('static struct tipc_member *tipc_group_create_member')
          en = g.index('\n}\n\nvoid tipc_group_add_member', st) + 3
          cm = g[st:en]
          if 'WRITE_ONCE(*grp->open, true);' not in cm:
              cm = one(cm, '\tgrp->member_cnt++;\n', '\tgrp->member_cnt++;\n\tWRITE_ONCE(*grp->open, true);\n', 'member open transition')
              g = g[:st] + cm + g[en:]

          st = g.index('static void tipc_group_delete_member')
          en = g.index('\n}\n', st) + 3
          dm = g[st:en]
          if 'WRITE_ONCE(*grp->open, false);' not in dm:
              dm = one(dm, '\tgrp->member_cnt--;\n', '\tgrp->member_cnt--;\n\tif (!grp->member_cnt)\n\t\tWRITE_ONCE(*grp->open, false);\n', 'member close transition')
              g = g[:st] + dm + g[en:]

          st = g.index('void tipc_group_delete(struct net *net, struct tipc_group *grp)')
          brace = g.index('{\n', st) + 2
          if 'WRITE_ONCE(*grp->open, false);' not in g[brace:brace+100]:
              g = g[:brace] + '\tWRITE_ONCE(*grp->open, false);\n' + g[brace:]

          sp.write_text(s); gp.write_text(g); hp.write_text(h); vp.write_text(v)
          PY

          git diff --check
          if grep -RInE '^(<<<<<<<|=======|>>>>>>>)' net/tipc include/uapi/linux/tipc.h; then
            exit 1
          fi
          git add net/tipc/socket.c net/tipc/group.c net/tipc/group.h net/tipc/server.c
          if ! git diff --cached --quiet; then
            git commit -m "tipc: harden communication groups lifetime and state

          Add the missing pre-refactor correctness, lifetime and teardown fixes
          required by the Sweet TIPC Groups backport while preserving the newer
          skb_queue_empty_lockless() poll behavior."
          fi

      - name: Static verification
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "${{ steps.guard.outputs.base }}..HEAD"
          grep -q 'skb_queue_empty_lockless' net/tipc/socket.c
          grep -q 'READ_ONCE(tsk->group_is_open)' net/tipc/socket.c
          grep -q 'if (IS_ERR(con))' net/tipc/server.c
          grep -q '\*(u64 \*)&sub.usr_handle = (u64)port;' net/tipc/server.c
          grep -q '__skb_queue_purge(&m->deferredq);' net/tipc/group.c
          grep -q 'return -EEXIST;' net/tipc/group.c
          grep -q 'less_eq(acked, m->bc_acked)' net/tipc/group.c
          grep -q 'tipc_group_bc_cong(tsk->group' net/tipc/socket.c
          grep -q 'dsts = tipc_group_dests(tsk->group);' net/tipc/socket.c
          ! grep -q 'grp->bc_ackers = grp->member_cnt;' net/tipc/group.c
          python3 - <<'PY'
          from pathlib import Path
          s = Path('net/tipc/socket.c').read_text()
          def block(name):
              st=s.index(name); en=s.index('\n}\n',st); return s[st:en]
          p=block('static unsigned int tipc_poll(')
          assert 'tipc_group_size(grp)' not in p
          assert 'struct tipc_group *grp = tsk->group;' not in p
          assert 'READ_ONCE(tsk->group_is_open)' in p
          u=block('static int tipc_send_group_unicast(')
          a=block('static int tipc_send_group_anycast(')
          b=block('static int tipc_send_group_bcast(')
          assert 'struct tipc_group *grp = tsk->group;' not in u
          assert 'struct tipc_group *grp = tsk->group;' not in a
          assert 'struct tipc_group *grp = tsk->group;' not in b
          assert 'tsk->group &&' in u and 'tsk->group &&' in a and 'tsk->group &&' in b
          assert b.index('dsts = tipc_group_dests(tsk->group);') > b.index('tipc_wait_for_cond')
          print('static assertions PASS')
          PY

      - name: Verify stable and push only TIPC_GROUPS
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin stable
          [[ "$(git rev-parse refs/remotes/origin/stable)" == "${{ steps.guard.outputs.stable }}" ]] || {
            echo "::error::stable changed; refusing push"
            exit 1
          }
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo "FINAL_HEAD=$(git rev-parse HEAD)"
          echo "STABLE_UNCHANGED=${{ steps.guard.outputs.stable }}"
