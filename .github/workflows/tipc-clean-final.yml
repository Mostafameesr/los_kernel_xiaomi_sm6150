name: TIPC clean final branch

on:
  push:
    branches:
      - TIPC_GROUPS_SPRING_FSM_20260915
    paths:
      - .github/workflows/tipc-clean-final.yml

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Rebuild clean branch from code-only commits
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config remote.origin.promisor true
          git config remote.origin.partialclonefilter blob:none
          git sparse-checkout init --cone
          git sparse-checkout set net/tipc include/uapi/linux .github/workflows
          git fetch --no-tags --filter=blob:none origin \
            TIPC_GROUPS \
            TIPC_GROUPS_SPRING_FSM_20260915 \
            TIPC_GROUPS_SPRING_FSM_CLEAN_20260915
          git checkout -B TIPC_GROUPS_SPRING_FSM_CLEAN_20260915 \
            origin/TIPC_GROUPS_SPRING_FSM_CLEAN_20260915
          git reset --hard origin/TIPC_GROUPS
          git config user.name "TIPC backport bot"
          git config user.email "tipc-backport@users.noreply.github.com"

          mapfile -t commits < <(git rev-list --reverse \
            origin/TIPC_GROUPS..origin/TIPC_GROUPS_SPRING_FSM_20260915)

          kept=0
          skipped=0
          for c in "${commits[@]}"; do
            mapfile -t paths < <(git diff-tree --no-commit-id --name-only -r "$c")
            code=0
            for p in "${paths[@]}"; do
              case "$p" in
                .github/*) ;;
                *) code=1 ;;
              esac
            done
            if [ "$code" -eq 0 ]; then
              echo "SKIP CI-only $c"
              skipped=$((skipped + 1))
              continue
            fi
            echo "KEEP code commit $c"
            git cherry-pick "$c"
            kept=$((kept + 1))
          done

          echo "KEPT=$kept SKIPPED=$skipped"
          test "$kept" -gt 0
          git diff --check origin/TIPC_GROUPS..HEAD

          changed="$(git diff --name-only origin/TIPC_GROUPS..HEAD | sort)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -E '^\.github/'; then
            echo 'unexpected workflow file in clean branch' >&2
            exit 1
          fi
          if printf '%s\n' "$changed" | grep -Ev '^(include/uapi/linux/tipc\.h|net/tipc/)'; then
            echo 'unexpected non-TIPC path in clean branch' >&2
            exit 1
          fi

          git push --force-with-lease origin \
            HEAD:TIPC_GROUPS_SPRING_FSM_CLEAN_20260915
