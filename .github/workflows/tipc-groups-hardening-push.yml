name: TIPC Groups hardening AUTO v3 (TIPC_GROUPS)

# AUTO-RUN: every user push to TIPC_GROUPS starts this workflow.
# Pushes made by this workflow use GITHUB_TOKEN and do not recursively trigger it.
on:
  push:
    branches:
      - TIPC_GROUPS

permissions:
  contents: write

concurrency:
  group: tipc-groups-hardening-${{ github.repository }}
  cancel-in-progress: false

env:
  TARGET_BRANCH: TIPC_GROUPS
  KNOWN_TIPC_BASE: 3812f557fb9b289e95c582fc364e6038f5431dde
  UPSTREAM_REPO: https://github.com/torvalds/linux.git

jobs:
  harden:
    name: Harden TIPC Groups and verify
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout TIPC_GROUPS only
        uses: actions/checkout@v4
        with:
          ref: TIPC_GROUPS
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Git identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config commit.gpgsign false

      - name: Safety guards and baseline audit
        id: baseline
        shell: bash
        run: |
          set -euo pipefail

          CURRENT_BRANCH="$(git branch --show-current)"
          [[ "$CURRENT_BRANCH" == "$TARGET_BRANCH" ]] || {
            echo "::error::Refusing to run on branch '$CURRENT_BRANCH'"
            exit 1
          }

          git fetch --no-tags origin stable "$TARGET_BRANCH"
          BASE_SHA="$(git rev-parse HEAD)"
          STABLE_BEFORE="$(git rev-parse refs/remotes/origin/stable)"
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "stable_before=$STABLE_BEFORE" >> "$GITHUB_OUTPUT"

          git merge-base --is-ancestor "$KNOWN_TIPC_BASE" HEAD || {
            echo "::error::HEAD is not descended from reviewed TIPC base $KNOWN_TIPC_BASE"
            exit 1
          }

          test -f net/tipc/group.c
          test -f net/tipc/group.h
          test -f net/tipc/socket.c
          test -f net/tipc/server.c
          test -f include/uapi/linux/tipc.h

          grep -Eq '^[[:space:]]*#define[[:space:]]+TIPC_GROUP_JOIN[[:space:]]+135' include/uapi/linux/tipc.h
          grep -Eq '^[[:space:]]*#define[[:space:]]+TIPC_GROUP_LEAVE[[:space:]]+136' include/uapi/linux/tipc.h
          grep -q 'struct tipc_group_req' include/uapi/linux/tipc.h
          grep -q 'group.o' net/tipc/Makefile
          grep -q 'skb_queue_empty_lockless' net/tipc/socket.c

          {
            echo "BASE_SHA=$BASE_SHA"
            echo "STABLE_BEFORE=$STABLE_BEFORE"
            git log -1 --oneline
          } > baseline-report.txt

      - name: Fetch reviewed pre-refactor upstream fixes
        shell: bash
        run: |
          set -euo pipefail
          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream "$UPSTREAM_REPO"
          else
            git remote add upstream "$UPSTREAM_REPO"
          fi

          FIXES=(
            234833991e14681f61cbfd93e65a5c976089cf11
            3f42f5fe31c8715a34064bfd7b788488d1ea2f7c
            3db096011722fd8717e57687ae94b6917a11c9cc
            bb25c3855a12cc58e33cd7ee9b69943790fe35f7
            0a3d805c9c503e05d6e5d3868c53e92a06589dcf
            3a33a19bf88cdfc6d982972bc6ffcf7a62c1015e
            f9c935db8086231a35b7f5c2a53e3f1e10f388ee
          )
          for c in "${FIXES[@]}"; do
            git fetch --no-tags upstream "$c"
          done

      - name: Apply clean upstream group correctness fixes
        shell: bash
        run: |
          set -euo pipefail
          FIXES=(
            234833991e14681f61cbfd93e65a5c976089cf11
            3f42f5fe31c8715a34064bfd7b788488d1ea2f7c
            3db096011722fd8717e57687ae94b6917a11c9cc
            bb25c3855a12cc58e33cd7ee9b69943790fe35f7
            0a3d805c9c503e05d6e5d3868c53e92a06589dcf
            3a33a19bf88cdfc6d982972bc6ffcf7a62c1015e
            f9c935db8086231a35b7f5c2a53e3f1e10f388ee
          )

          : > applied-upstream-fixes.txt
          for c in "${FIXES[@]}"; do
            subject="$(git show -s --format=%s "$c")"
            if git log --format=%s | grep -Fqx "$subject"; then
              echo "SKIP already present: $c $subject" | tee -a applied-upstream-fixes.txt
              continue
            fi

            echo "APPLY: $c $subject" | tee -a applied-upstream-fixes.txt
            if ! git cherry-pick -x "$c"; then
              git status --short | tee -a applied-upstream-fixes.txt
              git cherry-pick --abort || true
              echo "::error::Reviewed clean fix $c no longer applies cleanly; refusing to guess"
              exit 1
            fi
          done

      - name: Apply confirmed server and group safety fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          server_p = Path("net/tipc/server.c")
          group_p = Path("net/tipc/group.c")
          server = server_p.read_text()
          group = group_p.read_text()
          changed_server = False
          changed_group = False

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one old pattern, found {count}")
              return text.replace(old, new, 1)

          # c75e427d9349: tipc_alloc_conn() returns ERR_PTR(), not NULL.
          old = (
              "\tcon = tipc_alloc_conn(tipc_topsrv(net));\n"
              "\tif (!con)\n"
              "\t\treturn false;\n\n"
              "\t*conid = con->conid;\n"
          )
          new = (
              "\tcon = tipc_alloc_conn(tipc_topsrv(net));\n"
              "\tif (IS_ERR(con))\n"
              "\t\treturn false;\n\n"
              "\t*conid = con->conid;\n"
          )
          if new not in server:
              server = replace_once(server, old, new, "c75e427d ERR_PTR handling")
              changed_server = True

          # 777ecaabd614: initialize the entire 8-byte user handle.
          old = "\t*(u32 *)&sub.usr_handle = port;\n"
          new = "\t*(u64 *)&sub.usr_handle = (u64)port;\n"
          if new not in server:
              server = replace_once(server, old, new, "777ecaab usr_handle init")
              changed_server = True

          # 5cf02612b33f: purge each member deferred queue on group teardown.
          old = (
              "\t\ttipc_group_proto_xmit(grp, m, GRP_LEAVE_MSG, &xmitq);\n"
              "\t\tlist_del(&m->list);\n"
          )
          new = (
              "\t\ttipc_group_proto_xmit(grp, m, GRP_LEAVE_MSG, &xmitq);\n"
              "\t\t__skb_queue_purge(&m->deferredq);\n"
              "\t\tlist_del(&m->list);\n"
          )
          if new not in group:
              group = replace_once(group, old, new, "5cf02612 deferredq purge")
              changed_group = True

          # bb3a420d47ab: duplicate RB key must not leak a member or corrupt counts.
          start = group.index("static void tipc_group_add_to_tree") if "static void tipc_group_add_to_tree" in group else -1
          if start >= 0:
              end_marker = "\n}\n\nstatic struct tipc_member *tipc_group_create_member"
              end = group.index(end_marker, start) + 3
              fn = group[start:end]
              fn = fn.replace("static void tipc_group_add_to_tree", "static int tipc_group_add_to_tree", 1)
              old_dup = "\t\telse\n\t\t\treturn;\n"
              if old_dup not in fn:
                  raise SystemExit("bb3a420d: duplicate-key return pattern not found")
              fn = fn.replace(old_dup, "\t\telse\n\t\t\treturn -EEXIST;\n", 1)
              old_tail = "\trb_insert_color(&m->tree_node, &grp->members);\n}"
              if old_tail not in fn:
                  raise SystemExit("bb3a420d: RB insert tail not found")
              fn = fn.replace(old_tail, "\trb_insert_color(&m->tree_node, &grp->members);\n\treturn 0;\n}", 1)
              group = group[:start] + fn + group[end:]
              changed_group = True

          cm_start = group.index("static struct tipc_member *tipc_group_create_member")
          cm_end = group.index("\n}\n\nvoid tipc_group_add_member", cm_start) + 3
          cm = group[cm_start:cm_end]
          if "ret = tipc_group_add_to_tree(grp, m);" not in cm:
              if "\tstruct tipc_member *m;\n" not in cm:
                  raise SystemExit("bb3a420d: member declaration anchor not found")
              cm = cm.replace("\tstruct tipc_member *m;\n", "\tstruct tipc_member *m;\n\tint ret;\n", 1)
              old_seq = (
                  "\tm->bc_acked = grp->bc_snd_nxt - 1;\n"
                  "\tgrp->member_cnt++;\n"
                  "\ttipc_group_add_to_tree(grp, m);\n"
              )
              new_seq = (
                  "\tm->bc_acked = grp->bc_snd_nxt - 1;\n"
                  "\tret = tipc_group_add_to_tree(grp, m);\n"
                  "\tif (ret < 0) {\n"
                  "\t\tkfree(m);\n"
                  "\t\treturn NULL;\n"
                  "\t}\n"
                  "\tgrp->member_cnt++;\n"
              )
              if old_seq not in cm:
                  raise SystemExit("bb3a420d: create-member insertion sequence not found")
              cm = cm.replace(old_seq, new_seq, 1)
              group = group[:cm_start] + cm + group[cm_end:]
              changed_group = True

          # 48a5fe38772b: duplicate/stale group ACKs must be idempotent.
          pr_start = group.index("void tipc_group_proto_rcv(")
          pr_end = group.index("\n}\n\n/* tipc_group_member_evt", pr_start) + 3
          proto = group[pr_start:pr_end]
          if "acked = msg_grp_bc_acked(hdr);" not in proto:
              if "\tu16 remitted, in_flight;\n" not in proto:
                  raise SystemExit("48a5fe38: proto variable anchor not found")
              proto = proto.replace("\tu16 remitted, in_flight;\n", "\tu16 remitted, in_flight;\n\tu16 acked;\n", 1)
              old_ack = (
                  "\t\tm->bc_acked = msg_grp_bc_acked(hdr);\n"
                  "\t\tif (--grp->bc_ackers)\n"
                  "\t\t\tbreak;\n"
              )
              new_ack = (
                  "\t\tacked = msg_grp_bc_acked(hdr);\n"
                  "\t\tif (less_eq(acked, m->bc_acked))\n"
                  "\t\t\treturn;\n"
                  "\t\tm->bc_acked = acked;\n"
                  "\t\tif (--grp->bc_ackers)\n"
                  "\t\t\tbreak;\n"
              )
              if old_ack not in proto:
                  raise SystemExit("48a5fe38: ACK decrement block not found")
              proto = proto.replace(old_ack, new_ack, 1)
              group = group[:pr_start] + proto + group[pr_end:]
              changed_group = True

          server_p.write_text(server)
          group_p.write_text(group)
          print("server_changed=", changed_server)
          print("group_changed=", changed_group)
          PY

          git diff --check
          git diff -- net/tipc/server.c net/tipc/group.c
          if ! git diff --quiet; then
            git add net/tipc/server.c net/tipc/group.c
            git commit -m "tipc: fix group allocation and teardown safety

          Backport confirmed pre-refactor safety fixes for topology connection
          allocation, group member teardown, duplicate member insertion and
          duplicate group broadcast acknowledgements.

          Based-on: c75e427d9349, 5cf02612b33f, bb3a420d47ab,
          48a5fe38772b and 777ecaabd614"
          fi

      - name: Apply group send lifetime and poll hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          socket_p = Path("net/tipc/socket.c")
          group_p = Path("net/tipc/group.c")
          header_p = Path("net/tipc/group.h")
          socket = socket_p.read_text()
          group = group_p.read_text()
          header = header_p.read_text()
          changed = False

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one old pattern, found {count}")
              return text.replace(old, new, 1)

          # 143ece654f9f + 3c6306d44082, manually adapted to this pre-refactor tree.
          old = (
              "\tstruct tipc_sock *tsk = tipc_sk(sk);\n"
              "\tstruct tipc_group *grp = tsk->group;\n"
              "\tstruct net *net = sock_net(sk);\n"
          )
          new = (
              "\tstruct tipc_sock *tsk = tipc_sk(sk);\n"
              "\tstruct net *net = sock_net(sk);\n"
          )
          if old in socket:
              socket = replace_once(socket, old, new, "143ece unicast cached group")
              changed = True
          old = "\t\t\t\t!tipc_group_cong(grp, node, port, blks, &mb));\n"
          new = (
              "\t\t\t\ttsk->group &&\n"
              "\t\t\t\t!tipc_group_cong(tsk->group, node, port, blks, &mb));\n"
          )
          if old in socket:
              socket = replace_once(socket, old, new, "143ece unicast wait")
              changed = True

          old = "\tstruct tipc_group *grp = tsk->group;\n"
          # At this point only anycast should still have this exact declaration.
          if old in socket:
              socket = replace_once(socket, old, "", "143ece anycast cached group")
              changed = True
          old = "\tdomain = addr_domain(net, dest->scope);\n\texclude = tipc_group_exclude(grp);\n\n\twhile (++lookups < 4) {\n"
          new = "\tdomain = addr_domain(net, dest->scope);\n\n\twhile (++lookups < 4) {\n\t\texclude = tipc_group_exclude(tsk->group);\n\n"
          if old in socket:
              socket = replace_once(socket, old, new, "143ece anycast exclude reload")
              changed = True
          old = "\t\t\tcong = tipc_group_cong(grp, node, port, blks, &mbr);\n"
          new = "\t\t\tcong = tipc_group_cong(tsk->group, node, port, blks, &mbr);\n"
          if old in socket:
              socket = replace_once(socket, old, new, "143ece anycast lookup")
              changed = True
          old = (
              "\t\t\t\t\t!tipc_group_cong(grp, node, port,\n"
              "\t\t\t\t\t\t\t blks, &mbr));\n"
          )
          new = (
              "\t\t\t\t\ttsk->group &&\n"
              "\t\t\t\t\t!tipc_group_cong(tsk->group, node, port,\n"
              "\t\t\t\t\t\t\t blks, &mbr));\n"
          )
          if old in socket:
              socket = replace_once(socket, old, new, "143ece anycast wait")
              changed = True

          old = (
              "\tstruct tipc_sock *tsk = tipc_sk(sk);\n"
              "\tstruct tipc_group *grp = tsk->group;\n"
              "\tstruct tipc_nlist *dsts = tipc_group_dests(grp);\n"
          )
          new = (
              "\tstruct tipc_sock *tsk = tipc_sk(sk);\n"
              "\tstruct tipc_nlist *dsts;\n"
          )
          if old in socket:
              socket = replace_once(socket, old, new, "143ece/3c6306 bcast cached pointers")
              changed = True
          old = (
              "\tif (!dsts->local && !dsts->remote)\n"
              "\t\treturn -EHOSTUNREACH;\n\n"
              "\t/* Block or return if any destination link or member is congested */\n"
              "\trc = tipc_wait_for_cond(sock, &timeout,\t!tsk->cong_link_cnt &&\n"
              "\t\t\t\t!tipc_group_bc_cong(grp, blks));\n"
              "\tif (unlikely(rc))\n"
              "\t\treturn rc;\n\n"
          )
          new = (
              "\t/* Block or return if any destination link or member is congested */\n"
              "\trc = tipc_wait_for_cond(sock, &timeout,\n"
              "\t\t\t\t!tsk->cong_link_cnt && tsk->group &&\n"
              "\t\t\t\t!tipc_group_bc_cong(tsk->group, blks));\n"
              "\tif (unlikely(rc))\n"
              "\t\treturn rc;\n\n"
              "\tdsts = tipc_group_dests(tsk->group);\n"
              "\tif (!dsts->local && !dsts->remote)\n"
              "\t\treturn -EHOSTUNREACH;\n\n"
          )
          if old in socket:
              socket = replace_once(socket, old, new, "143ece/3c6306 bcast wait and dest reload")
              changed = True
          old = "\tmsg_set_grp_bc_seqno(hdr, tipc_group_bc_snd_nxt(grp));\n"
          new = "\tmsg_set_grp_bc_seqno(hdr, tipc_group_bc_snd_nxt(tsk->group));\n"
          if old in socket:
              socket = replace_once(socket, old, new, "143ece bcast sequence group")
              changed = True

          # 60c253 + 1b22 semantics: poll must never dereference tsk->group.
          if "bool group_is_open;" not in socket:
              socket = replace_once(
                  socket,
                  "\tstruct tipc_group *group;\n",
                  "\tstruct tipc_group *group;\n\tbool group_is_open;\t/* poll-safe group write readiness */\n",
                  "tipc_sock group_is_open",
              )
              changed = True

          if "\ttsk->group_is_open = true;\n" not in socket:
              socket = replace_once(
                  socket,
                  "\ttsk->conn_timeout = CONN_TIMEOUT_DEFAULT;\n\tatomic_set(&tsk->dupl_rcvcnt, 0);\n",
                  "\ttsk->conn_timeout = CONN_TIMEOUT_DEFAULT;\n\ttsk->group_is_open = true;\n\tatomic_set(&tsk->dupl_rcvcnt, 0);\n",
                  "tipc_sk_create group readiness init",
              )
              changed = True

          poll_start = socket.index("static unsigned int tipc_poll(")
          poll_end = socket.index("\n}\n", poll_start) + 3
          poll = socket[poll_start:poll_end]
          if "\tstruct tipc_group *grp = tsk->group;\n" in poll:
              poll = poll.replace("\tstruct tipc_group *grp = tsk->group;\n", "", 1)
              changed = True
          old_poll = (
              "\tcase TIPC_OPEN:\n"
              "\t\tif (!grp || tipc_group_size(grp))\n"
              "\t\t\tif (!tsk->cong_link_cnt)\n"
              "\t\t\t\trevents |= POLLOUT;\n"
          )
          new_poll = (
              "\tcase TIPC_OPEN:\n"
              "\t\tif (READ_ONCE(tsk->group_is_open) && !tsk->cong_link_cnt)\n"
              "\t\t\trevents |= POLLOUT;\n"
          )
          if old_poll in poll:
              poll = poll.replace(old_poll, new_poll, 1)
              changed = True
          elif new_poll not in poll:
              raise SystemExit("60c253: poll readiness block has unexpected layout")
          socket = socket[:poll_start] + poll + socket[poll_end:]

          old_call = "grp = tipc_group_create(net, tsk->portid, mreq);"
          new_call = "grp = tipc_group_create(net, tsk->portid, mreq,\n\t\t\t\t&tsk->group_is_open);"
          if old_call in socket:
              socket = socket.replace(old_call, new_call, 1)
              changed = True
          elif new_call not in socket:
              raise SystemExit("tipc_sk_join group create call not found")

          old = "\tif (rc) {\n\t\ttipc_group_delete(net, grp);\n\t\ttsk->group = NULL;\n\t}\n"
          new = "\tif (rc) {\n\t\ttipc_group_delete(net, grp);\n\t\ttsk->group = NULL;\n\t\tWRITE_ONCE(tsk->group_is_open, true);\n\t}\n"
          if old in socket:
              socket = socket.replace(old, new, 1)
              changed = True
          elif new not in socket:
              raise SystemExit("failed JOIN cleanup block not found")

          old = "\ttipc_group_delete(net, grp);\n\ttsk->group = NULL;\n\ttipc_sk_withdraw(tsk, scope, &seq);\n"
          new = "\ttipc_group_delete(net, grp);\n\ttsk->group = NULL;\n\tWRITE_ONCE(tsk->group_is_open, true);\n\ttipc_sk_withdraw(tsk, scope, &seq);\n"
          if old in socket:
              socket = socket.replace(old, new, 1)
              changed = True
          elif new not in socket:
              raise SystemExit("LEAVE cleanup block not found")

          old_decl = (
              "struct tipc_group *tipc_group_create(struct net *net, u32 portid,\n"
              "\t\t\t\t     struct tipc_group_req *mreq);"
          )
          new_decl = (
              "struct tipc_group *tipc_group_create(struct net *net, u32 portid,\n"
              "\t\t\t\t     struct tipc_group_req *mreq,\n"
              "\t\t\t\t     bool *group_is_open);"
          )
          if old_decl in header:
              header = header.replace(old_decl, new_decl, 1)
              changed = True
          elif new_decl not in header:
              raise SystemExit("group.h create declaration not found")

          if "\tbool *open;\n" not in group and "\tbool *open;\t\t/* readiness lives in struct tipc_sock */\n" not in group:
              group = replace_once(
                  group,
                  "\tu16 bc_ackers;\n",
                  "\tu16 bc_ackers;\n\tbool *open;\t\t/* readiness lives in struct tipc_sock */\n",
                  "group open pointer",
              )
              changed = True

          old_def = (
              "struct tipc_group *tipc_group_create(struct net *net, u32 portid,\n"
              "\t\t\t\t     struct tipc_group_req *mreq)"
          )
          new_def = (
              "struct tipc_group *tipc_group_create(struct net *net, u32 portid,\n"
              "\t\t\t\t     struct tipc_group_req *mreq,\n"
              "\t\t\t\t     bool *group_is_open)"
          )
          if old_def in group:
              group = group.replace(old_def, new_def, 1)
              changed = True
          elif new_def not in group:
              raise SystemExit("group.c create definition not found")

          if "\tgrp->open = group_is_open;\n" not in group:
              group = replace_once(
                  group,
                  "\tgrp->events = mreq->flags & TIPC_GROUP_MEMBER_EVTS;\n",
                  "\tgrp->events = mreq->flags & TIPC_GROUP_MEMBER_EVTS;\n\tgrp->open = group_is_open;\n",
                  "group open assignment",
              )
              changed = True

          if "WRITE_ONCE(*grp->open, false);" not in group:
              pat = re.compile(r"(\tif \(tipc_topsrv_kern_subscr\([^\n]*\)\)\n)(\t\treturn grp;)")
              m = pat.search(group)
              if not m:
                  raise SystemExit("topology subscription success block not found")
              group = group[:m.start()] + m.group(1) + "\t\tWRITE_ONCE(*grp->open, false);\n" + m.group(2) + group[m.end():]
              changed = True

          if "\tWRITE_ONCE(*grp->open, true);\n" not in group:
              group = replace_once(
                  group,
                  "\tgrp->member_cnt++;\n",
                  "\tgrp->member_cnt++;\n\tWRITE_ONCE(*grp->open, true);\n",
                  "member count open transition",
              )
              changed = True

          old = "\tgrp->member_cnt--;\n"
          new = "\tgrp->member_cnt--;\n\tif (!grp->member_cnt)\n\t\tWRITE_ONCE(*grp->open, false);\n"
          if new not in group:
              group = replace_once(group, old, new, "member count close transition")
              changed = True

          delete_sig = "void tipc_group_delete(struct net *net, struct tipc_group *grp)\n{\n"
          delete_new = "void tipc_group_delete(struct net *net, struct tipc_group *grp)\n{\n\tWRITE_ONCE(*grp->open, false);\n"
          if delete_new not in group:
              group = replace_once(group, delete_sig, delete_new, "group delete close transition")
              changed = True

          socket_p.write_text(socket)
          group_p.write_text(group)
          header_p.write_text(header)
          print("lifetime_hardening_changed=", changed)
          PY

          git diff --check
          git diff -- net/tipc/socket.c net/tipc/group.c net/tipc/group.h
          if ! git diff --quiet; then
            git add net/tipc/socket.c net/tipc/group.c net/tipc/group.h
            git commit -m "tipc: harden group lifetime across waits and poll

          Manually adapt the upstream poll/setsockopt and send-wait lifetime
          fixes to the pre-refactor communication-groups implementation.
          Reload live group state after waits and reload broadcast destinations
          only after the socket lock has been reacquired.

          Based-on: 60c253069632, 1b22bcad7e39, 143ece654f9f and 3c6306d44082"
          fi

      - name: Static integrity verification
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ steps.baseline.outputs.base_sha }}"
          git diff --check "$BASE..HEAD"

          if grep -RInE '^(<<<<<<<|=======|>>>>>>>)' net/tipc include/uapi/linux/tipc.h; then
            echo "::error::Conflict marker found"
            exit 1
          fi

          grep -Eq '^[[:space:]]*#define[[:space:]]+TIPC_GROUP_JOIN[[:space:]]+135' include/uapi/linux/tipc.h
          grep -Eq '^[[:space:]]*#define[[:space:]]+TIPC_GROUP_LEAVE[[:space:]]+136' include/uapi/linux/tipc.h
          grep -q 'struct tipc_group_req' include/uapi/linux/tipc.h
          grep -q 'skb_queue_empty_lockless' net/tipc/socket.c
          grep -q 'if (IS_ERR(con))' net/tipc/server.c
          grep -q '\*(u64 \*)&sub.usr_handle = (u64)port;' net/tipc/server.c
          grep -q '__skb_queue_purge(&m->deferredq);' net/tipc/group.c
          grep -q 'return -EEXIST;' net/tipc/group.c
          grep -q 'ret = tipc_group_add_to_tree(grp, m);' net/tipc/group.c
          grep -q 'acked = msg_grp_bc_acked(hdr);' net/tipc/group.c
          grep -q 'less_eq(acked, m->bc_acked)' net/tipc/group.c
          grep -q 'READ_ONCE(tsk->group_is_open)' net/tipc/socket.c
          grep -q 'WRITE_ONCE(tsk->group_is_open, true)' net/tipc/socket.c

          python3 - <<'PY'
          from pathlib import Path
          s = Path("net/tipc/socket.c").read_text()

          def fn(name, next_marker="\n}\n"):
              st = s.index(name)
              en = s.index(next_marker, st) + len(next_marker)
              return s[st:en]

          poll = fn("static unsigned int tipc_poll(")
          for bad in ("struct tipc_group *grp = tsk->group;", "tipc_group_size(grp)", "tipc_group_is_open(grp)"):
              if bad in poll:
                  raise SystemExit(f"unsafe poll group dereference remains: {bad}")
          if "skb_queue_empty_lockless" not in poll or "READ_ONCE(tsk->group_is_open)" not in poll:
              raise SystemExit("poll hardening or Sweet lockless queue check missing")

          uni = fn("static int tipc_send_group_unicast(")
          if "struct tipc_group *grp = tsk->group;" in uni:
              raise SystemExit("unicast still caches tsk->group across wait")
          if "tsk->group &&" not in uni or "tipc_group_cong(tsk->group" not in uni:
              raise SystemExit("unicast live group recheck missing")

          anyc = fn("static int tipc_send_group_anycast(")
          if "struct tipc_group *grp = tsk->group;" in anyc:
              raise SystemExit("anycast still caches tsk->group across wait")
          if "exclude = tipc_group_exclude(tsk->group);" not in anyc:
              raise SystemExit("anycast group reload missing")
          if "tsk->group &&" not in anyc or "tipc_group_cong(tsk->group" not in anyc:
              raise SystemExit("anycast live group recheck missing")

          bc = fn("static int tipc_send_group_bcast(")
          if "struct tipc_group *grp = tsk->group;" in bc:
              raise SystemExit("broadcast still caches tsk->group")
          if "struct tipc_nlist *dsts = tipc_group_dests" in bc:
              raise SystemExit("broadcast still caches destinations before wait")
          wait_pos = bc.index("tipc_wait_for_cond")
          dst_pos = bc.index("dsts = tipc_group_dests(tsk->group);")
          if dst_pos < wait_pos:
              raise SystemExit("broadcast destinations are loaded before wait")
          if "tsk->group &&" not in bc or "tipc_group_bc_cong(tsk->group" not in bc:
              raise SystemExit("broadcast live group recheck missing")

          g = Path("net/tipc/group.c").read_text()
          if "grp->bc_ackers = grp->member_cnt;" in g:
              raise SystemExit("actual-receiver ACK counter fix missing")
          print("TIPC lifetime/static assertions: PASS")
          PY

          {
            echo "=== static verification PASS ==="
            echo "HEAD=$(git rev-parse HEAD)"
            echo "BASE=$BASE"
            echo
            echo "=== commits added ==="
            git log --oneline "$BASE..HEAD"
            echo
            echo "=== diffstat ==="
            git diff --stat "$BASE..HEAD"
          } > static-verification.txt

      - name: Verify stable was not touched
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin stable
          STABLE_NOW="$(git rev-parse refs/remotes/origin/stable)"
          STABLE_BEFORE="${{ steps.baseline.outputs.stable_before }}"
          [[ "$STABLE_NOW" == "$STABLE_BEFORE" ]] || {
            echo "::error::stable changed during run; refusing to push"
            echo "before=$STABLE_BEFORE now=$STABLE_NOW"
            exit 1
          }
          echo "stable unchanged: $STABLE_NOW"

      - name: Final report
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "TIPC GROUPS HARDENING REPORT"
            echo "repository=$GITHUB_REPOSITORY"
            echo "branch=$TARGET_BRANCH"
            echo "base=${{ steps.baseline.outputs.base_sha }}"
            echo "final=$(git rev-parse HEAD)"
            echo "stable=${{ steps.baseline.outputs.stable_before }}"
            echo "build=NOT_RUN_BY_THIS_WORKFLOW"
            echo
            cat applied-upstream-fixes.txt
            echo
            git log --oneline "${{ steps.baseline.outputs.base_sha }}..HEAD"
            echo
            git diff --stat "${{ steps.baseline.outputs.base_sha }}..HEAD"
            echo
            git status --short
          } | tee tipc-hardening-report.txt

      - name: Upload audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tipc-groups-hardening-report
          if-no-files-found: error
          retention-days: 14
          path: |
            baseline-report.txt
            applied-upstream-fixes.txt
            static-verification.txt
            tipc-hardening-report.txt

      - name: Push verified commits to TIPC_GROUPS only
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git branch --show-current)" == "$TARGET_BRANCH" ]] || exit 1
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          git fetch --no-tags origin stable "$TARGET_BRANCH"
          REMOTE_TIPC="$(git rev-parse "refs/remotes/origin/$TARGET_BRANCH")"
          LOCAL_HEAD="$(git rev-parse HEAD)"
          REMOTE_STABLE="$(git rev-parse refs/remotes/origin/stable)"
          [[ "$REMOTE_TIPC" == "$LOCAL_HEAD" ]]
          [[ "$REMOTE_STABLE" == "${{ steps.baseline.outputs.stable_before }}" ]]
          echo "PUSH_OK=$REMOTE_TIPC"
          echo "STABLE_UNCHANGED=$REMOTE_STABLE"
