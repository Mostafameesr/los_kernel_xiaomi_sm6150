name: TIPC Sweet compile validation

on:
  push:
    branches:
      - TIPC_GROUPS_SPRING_FSM_20260915
    paths:
      - .github/workflows/tipc-spring-fsm-fast.yml

permissions:
  contents: read

jobs:
  build-tipc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4
        with:
          ref: TIPC_GROUPS_SPRING_FSM_20260915
          fetch-depth: 1

      - name: Install kernel build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y bc bison flex libelf-dev libssl-dev llvm lld

      - name: Show toolchain
        shell: bash
        run: |
          set -euxo pipefail
          clang --version
          ld.lld --version
          llvm-ar --version
          llvm-nm --version

      - name: Generate Sweet configuration
        shell: bash
        run: |
          set -euxo pipefail
          make O=out ARCH=arm64 LLVM=1 vendor/sweet_defconfig
          grep '^CONFIG_TIPC=y' out/.config
          grep '^CONFIG_ARCH_SM6150=y' out/.config

      - name: Build TIPC objects
        shell: bash
        run: |
          set -euxo pipefail
          make O=out ARCH=arm64 LLVM=1 -j2 net/tipc/built-in.o V=1
          test -s out/net/tipc/built-in.o
          file out/net/tipc/built-in.o

      - name: Compile changed TIPC translation units explicitly
        shell: bash
        run: |
          set -euxo pipefail
          make O=out ARCH=arm64 LLVM=1 -j2 \
            net/tipc/group.o \
            net/tipc/socket.o \
            net/tipc/name_table.o \
            net/tipc/server.o \
            net/tipc/subscr.o V=1
          for f in group socket name_table server subscr; do
            test -s "out/net/tipc/${f}.o"
          done

      - name: Check generated objects
        shell: bash
        run: |
          set -euxo pipefail
          llvm-nm out/net/tipc/group.o > /tmp/group.nm
          grep ' tipc_group_join$' /tmp/group.nm
