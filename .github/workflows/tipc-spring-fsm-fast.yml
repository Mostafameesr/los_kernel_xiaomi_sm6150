name: TIPC Spring FSM phase 2 final runner

on:
  push:
    branches:
      - TIPC_GROUPS_SPRING_FSM_20260915
    paths:
      - .github/workflows/tipc-spring-fsm-fast.yml

permissions:
  contents: write

jobs:
  backport:
    runs-on: ubuntu-latest
    steps:
      - name: Sparse checkout work branch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config remote.origin.promisor true
          git config remote.origin.partialclonefilter blob:none
          git sparse-checkout init --cone
          git sparse-checkout set net/tipc include/uapi/linux .github/workflows
          git fetch --no-tags --depth=2 --filter=blob:none origin TIPC_GROUPS_SPRING_FSM_20260915
          git checkout -B TIPC_GROUPS_SPRING_FSM_20260915 FETCH_HEAD
          find net/tipc include/uapi/linux -type f -print0 | xargs -0 cat >/dev/null

      - name: Execute reviewed phase2 backport script
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          from pathlib import Path

          text = subprocess.check_output(
              ['git', 'show', 'HEAD^:.github/workflows/tipc-spring-fsm-fast.yml'],
              text=True,
          )
          marker = '      - name: Apply Spring group join and topology semantics\n'
          pos = text.index(marker)
          pos = text.index('        run: |\n', pos) + len('        run: |\n')
          body = []
          for line in text[pos:].splitlines(True):
              if line.strip() and not line.startswith('          '):
                  break
              if line.startswith('          '):
                  body.append(line[10:])
              else:
                  body.append(line)
          script = ''.join(body)
          if 'git diff --check HEAD~7..HEAD' not in script:
              raise SystemExit('expected reviewed phase2 verification line not found')
          script = script.replace('git diff --check HEAD~7..HEAD',
                                  'git diff --check HEAD~6..HEAD', 1)
          Path('/tmp/tipc-phase2.sh').write_text(script)
          PY
          bash -euxo pipefail /tmp/tipc-phase2.sh
