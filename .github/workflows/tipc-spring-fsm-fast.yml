name: TIPC Sweet compile validation

on:
  push:
    branches:
      - TIPC_GROUPS_SPRING_FSM_20260915
    paths:
      - .github/workflows/tipc-spring-fsm-fast.yml

permissions:
  contents: read

jobs:
  build-tipc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4
        with:
          ref: TIPC_GROUPS_SPRING_FSM_20260915
          fetch-depth: 1

      - name: Install kernel build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y bc bison flex libelf-dev libssl-dev llvm lld

      - name: Generate Sweet configuration
        shell: bash
        run: |
          set -euxo pipefail
          clang --version
          ld.lld --version
          make O=out ARCH=arm64 LLVM=1 vendor/sweet_defconfig
          grep '^CONFIG_TIPC=y' out/.config
          grep '^CONFIG_ARCH_SM6150=y' out/.config

      - name: Build complete TIPC directory
        shell: bash
        run: |
          set -euxo pipefail
          make O=out ARCH=arm64 LLVM=1 -j2 net/tipc/ V=1
          find out/net/tipc -maxdepth 1 -type f -name '*.o' -print | sort
          test -s out/net/tipc/group.o
          test -s out/net/tipc/socket.o
          test -s out/net/tipc/name_table.o
          test -s out/net/tipc/server.o
          test -s out/net/tipc/subscr.o

      - name: Validate key symbols
        shell: bash
        run: |
          set -euxo pipefail
          llvm-nm out/net/tipc/group.o > /tmp/group.nm
          grep ' tipc_group_join$' /tmp/group.nm
          llvm-nm out/net/tipc/socket.o > /tmp/socket.nm
          grep ' tipc_sk_rht_init$' /tmp/socket.nm
