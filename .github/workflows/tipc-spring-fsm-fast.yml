name: TIPC Spring FSM fast backport

on:
  push:
    branches:
      - TIPC_GROUPS_SPRING_FSM_20260915
    paths:
      - .github/workflows/tipc-spring-fsm-fast.yml

permissions:
  contents: write

jobs:
  backport:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout work branch shallow
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: TIPC_GROUPS_SPRING_FSM_20260915

      - name: Apply upstream TIPC group FSM prerequisites
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "TIPC backport bot"
          git config user.email "tipc-backport@users.noreply.github.com"
          git remote add linux-upstream https://github.com/torvalds/linux.git || true

          commits=(
            38266ca17c5f142a25d4563335e143cbd62e65a7
            d84d1b3b6b8c296de8d394002bc3a0ca910d7460
            8d5dee21f6f01f4632c10b750709a1383eefc7aa
            4ea5dab541717fc55cad609360b100857af770b0
            0233493a5fad227645f7f02539cb42db72e76030
            7ad32bcb7855ae8a60a8cf98e1b9da77cfdba4d0
            c2b22bcf2e18a279afd80a8c57e936014acf3348
          )

          for c in "${commits[@]}"; do
            git fetch --no-tags --depth=1 linux-upstream "$c"
            git cherry-pick FETCH_HEAD
          done

          git diff --check HEAD~7..HEAD
          ! grep -q "MBR_QUARANTINED" net/tipc/group.c
          ! grep -q "event_msg" net/tipc/group.c
          ! grep -q "struct list_head reclaiming" net/tipc/group.c
          ! grep -q "struct list_head congested" net/tipc/group.c
          grep -q "MBR_DISCOVERED" net/tipc/group.c
          grep -q "small_win" net/tipc/group.c

          git push origin HEAD:TIPC_GROUPS_SPRING_FSM_20260915
