name: Final clean Sweet kernel validation

on:
  push:
    branches:
      - TIPC_GROUPS_SPRING_FSM_20260915
    paths:
      - .github/workflows/tipc-spring-fsm-fast.yml

permissions:
  contents: read

jobs:
  final-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout clean code-only branch
        uses: actions/checkout@v4
        with:
          ref: TIPC_GROUPS_SPRING_FSM_CLEAN_20260915
          fetch-depth: 1

      - name: Install kernel build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y bc bison flex libelf-dev libssl-dev llvm lld

      - name: Configure Sweet
        shell: bash
        run: |
          set -euxo pipefail
          clang --version
          ld.lld --version
          make O=out ARCH=arm64 LLVM=1 vendor/sweet_defconfig
          grep '^CONFIG_TIPC=y' out/.config
          grep '^CONFIG_ARCH_SM6150=y' out/.config

      - name: Compile complete TIPC directory
        shell: bash
        run: |
          set -euxo pipefail
          make O=out ARCH=arm64 LLVM=1 -j"$(nproc)" net/tipc/
          test -s out/net/tipc/group.o
          test -s out/net/tipc/socket.o
          test -s out/net/tipc/name_table.o
          test -s out/net/tipc/server.o
          test -s out/net/tipc/subscr.o

      - name: Build final Sweet Image.gz
        shell: bash
        run: |
          set -euxo pipefail
          make O=out ARCH=arm64 LLVM=1 -j"$(nproc)" Image.gz
          test -s out/arch/arm64/boot/Image.gz
          file out/arch/arm64/boot/Image.gz
          sha256sum out/arch/arm64/boot/Image.gz
