name: Fix TIPC phase2 shallow verification

on:
  push:
    branches:
      - TIPC_GROUPS_SPRING_FSM_20260915
    paths:
      - .github/workflows/fix-tipc-phase2-check.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Patch phase2 verification depth
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config remote.origin.promisor true
          git config remote.origin.partialclonefilter blob:none
          git sparse-checkout init --cone
          git sparse-checkout set .github/workflows
          git fetch --no-tags --depth=1 --filter=blob:none origin TIPC_GROUPS_SPRING_FSM_20260915
          git checkout -B TIPC_GROUPS_SPRING_FSM_20260915 FETCH_HEAD
          git config user.name "TIPC backport bot"
          git config user.email "tipc-backport@users.noreply.github.com"
          sed -i 's/HEAD~7\.\.HEAD/HEAD~6..HEAD/' .github/workflows/tipc-spring-fsm-fast.yml
          grep -q 'git diff --check HEAD~6..HEAD' .github/workflows/tipc-spring-fsm-fast.yml
          git add .github/workflows/tipc-spring-fsm-fast.yml
          git commit -m "ci: fix shallow phase2 verification range"
          git push origin HEAD:TIPC_GROUPS_SPRING_FSM_20260915
