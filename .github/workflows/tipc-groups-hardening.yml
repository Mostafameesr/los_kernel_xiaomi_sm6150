name: TIPC Groups hardening + source verification

on:
  workflow_dispatch:
    inputs:
      push_changes:
        description: "Push verified commits back to TIPC_GROUPS"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: tipc-groups-hardening-${{ github.repository }}
  cancel-in-progress: false

env:
  TARGET_BRANCH: TIPC_GROUPS
  KNOWN_TIPC_BASE: 3812f557fb9b289e95c582fc364e6038f5431dde
  UPSTREAM_REPO: https://github.com/torvalds/linux.git

jobs:
  harden:
    name: Harden TIPC Groups and verify
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout TIPC_GROUPS only
        uses: actions/checkout@v4
        with:
          ref: TIPC_GROUPS
          fetch-depth: 0
          persist-credentials: true

      - name: Safety guards and baseline audit
        id: baseline
        shell: bash
        run: |
          set -euo pipefail

          CURRENT_BRANCH="$(git branch --show-current)"
          if [[ "$CURRENT_BRANCH" != "$TARGET_BRANCH" ]]; then
            echo "::error::Refusing to run on branch '$CURRENT_BRANCH'. Expected '$TARGET_BRANCH'."
            exit 1
          fi

          git fetch --no-tags origin stable "$TARGET_BRANCH"

          BASE_SHA="$(git rev-parse HEAD)"
          STABLE_BEFORE="$(git rev-parse refs/remotes/origin/stable)"

          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "stable_before=$STABLE_BEFORE" >> "$GITHUB_OUTPUT"

          # The workflow is only valid on the already reviewed TIPC backport lineage.
          if ! git merge-base --is-ancestor "$KNOWN_TIPC_BASE" HEAD; then
            echo "::error::HEAD does not descend from reviewed TIPC base $KNOWN_TIPC_BASE"
            exit 1
          fi

          test -f net/tipc/group.c
          test -f net/tipc/group.h
          test -f net/tipc/socket.c
          test -f include/uapi/linux/tipc.h

          grep -Eq '^[[:space:]]*#define[[:space:]]+TIPC_GROUP_JOIN[[:space:]]+135' include/uapi/linux/tipc.h
          grep -Eq '^[[:space:]]*#define[[:space:]]+TIPC_GROUP_LEAVE[[:space:]]+136' include/uapi/linux/tipc.h
          grep -q 'struct tipc_group_req' include/uapi/linux/tipc.h
          grep -q 'group.o' net/tipc/Makefile
          grep -q 'tipc_send_group_bcast' net/tipc/socket.c
          grep -q 'skb_queue_empty_lockless' net/tipc/socket.c

          # Confirm that this tree still has the unsafe pre-fix poll pattern,
          # or that our hardening has already been applied.
          if grep -q 'bool group_is_open;' net/tipc/socket.c; then
            echo "poll_hardening_state=already_present" >> "$GITHUB_OUTPUT"
          else
            python3 - <<'PY'
          from pathlib import Path
          s = Path("net/tipc/socket.c").read_text()
          start = s.find("static unsigned int tipc_poll(")
          end = s.find("\n}\n", start)
          if start < 0 or end < 0:
              raise SystemExit("Could not locate tipc_poll()")
          poll = s[start:end + 3]
          if "struct tipc_group *grp = tsk->group;" not in poll:
              raise SystemExit("Unexpected tipc_poll() layout: reviewed unsafe pattern not found")
          if "tipc_group_size(grp)" not in poll:
              raise SystemExit("Unexpected tipc_poll() layout: group size readiness test not found")
          print("Verified reviewed pre-hardening tipc_poll() layout")
          PY
            echo "poll_hardening_state=needs_fix" >> "$GITHUB_OUTPUT"
          fi

          {
            echo "BASE_SHA=$BASE_SHA"
            echo "STABLE_BEFORE=$STABLE_BEFORE"
            echo
            echo "=== HEAD ==="
            git log -1 --oneline
            echo
            echo "=== TIPC ABI ==="
            grep -nE 'TIPC_GROUP_(JOIN|LEAVE)|struct tipc_group_req' include/uapi/linux/tipc.h
            echo
            echo "=== current poll excerpt ==="
            sed -n '/static unsigned int tipc_poll(/,/^}/p' net/tipc/socket.c
          } > baseline-report.txt

      - name: Configure upstream and fetch reviewed fixes
        shell: bash
        run: |
          set -euo pipefail

          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream "$UPSTREAM_REPO"
          else
            git remote add upstream "$UPSTREAM_REPO"
          fi

          # Bug fixes for the original 2017 Communication Groups implementation,
          # before the larger 2018 refactor series.
          FIXES=(
            234833991e14681f61cbfd93e65a5c976089cf11
            3f42f5fe31c8715a34064bfd7b788488d1ea2f7c
            3db096011722fd8717e57687ae94b6917a11c9cc
            bb25c3855a12cc58e33cd7ee9b69943790fe35f7
            0a3d805c9c503e05d6e5d3868c53e92a06589dcf
            3a33a19bf88cdfc6d982972bc6ffcf7a62c1015e
            f9c935db8086231a35b7f5c2a53e3f1e10f388ee

            # Lifetime fixes that apply to the group send wait paths.
            143ece654f9f5b37bedea252a990be37e48ae3a5
            3c6306d44082ef007a258ae1b86ea58e6974ee3f
          )

          for c in "${FIXES[@]}"; do
            git fetch --no-tags upstream "$c"
          done

      - name: Apply upstream group correctness and lifetime fixes
        shell: bash
        run: |
          set -euo pipefail

          FIXES=(
            234833991e14681f61cbfd93e65a5c976089cf11
            3f42f5fe31c8715a34064bfd7b788488d1ea2f7c
            3db096011722fd8717e57687ae94b6917a11c9cc
            bb25c3855a12cc58e33cd7ee9b69943790fe35f7
            0a3d805c9c503e05d6e5d3868c53e92a06589dcf
            3a33a19bf88cdfc6d982972bc6ffcf7a62c1015e
            f9c935db8086231a35b7f5c2a53e3f1e10f388ee
            143ece654f9f5b37bedea252a990be37e48ae3a5
            3c6306d44082ef007a258ae1b86ea58e6974ee3f
          )

          : > applied-upstream-fixes.txt

          for c in "${FIXES[@]}"; do
            subject="$(git show -s --format=%s "$c")"

            # Idempotence by upstream subject. The previous backport uses
            # rewritten local SHAs, so ancestry alone is not sufficient.
            if git log --format=%s | grep -Fqx "$subject"; then
              echo "SKIP already present: $c $subject" | tee -a applied-upstream-fixes.txt
              continue
            fi

            echo "APPLY: $c $subject" | tee -a applied-upstream-fixes.txt

            if git cherry-pick -x "$c"; then
              continue
            fi

            # Never guess through a conflict in networking lifetime code.
            if [[ -f .git/CHERRY_PICK_HEAD ]]; then
              {
                echo
                echo "CONFLICT while applying $c $subject"
                git status --short
                git diff --name-only --diff-filter=U
              } | tee -a applied-upstream-fixes.txt
              git cherry-pick --abort || true
            fi

            echo "::error::Upstream fix $c did not apply cleanly. No push will occur."
            exit 1
          done

      - name: Apply pre-refactor poll/set-sock lifetime hardening
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          socket_p = Path("net/tipc/socket.c")
          group_p = Path("net/tipc/group.c")
          header_p = Path("net/tipc/group.h")

          socket = socket_p.read_text()
          group = group_p.read_text()
          header = header_p.read_text()

          def replace_once(text, old, new, label):
              if new in text:
                  return text, False
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one old pattern, found {count}")
              return text.replace(old, new, 1), True

          changed = False

          # -----------------------------------------------------------------
          # Adapt the upstream 60c253 lifetime idea to the older pre-eb929
          # group implementation in this branch.
          #
          # Current semantics are intentionally preserved:
          #   non-group socket           -> POLLOUT eligible
          #   group with zero members    -> no POLLOUT
          #   group with >= 1 member     -> POLLOUT eligible
          #
          # poll() must never dereference tsk->group because JOIN/LEAVE can
          # free it concurrently.
          # -----------------------------------------------------------------

          if "bool group_is_open;" not in socket:
              socket, did = replace_once(
                  socket,
                  "\tstruct tipc_group *group;\n",
                  "\tstruct tipc_group *group;\n"
                  "\tbool group_is_open;\t/* poll-safe group write readiness */\n",
                  "tipc_sock.group_is_open",
              )
              changed |= did

          if "tsk->group_is_open = true;" not in socket:
              socket, did = replace_once(
                  socket,
                  "\ttsk->conn_timeout = CONN_TIMEOUT_DEFAULT;\n"
                  "\tatomic_set(&tsk->dupl_rcvcnt, 0);\n",
                  "\ttsk->conn_timeout = CONN_TIMEOUT_DEFAULT;\n"
                  "\ttsk->group_is_open = true;\n"
                  "\tatomic_set(&tsk->dupl_rcvcnt, 0);\n",
                  "tipc_sk_create group readiness init",
              )
              changed |= did

          # Patch only tipc_poll(), not other group users.
          poll_start = socket.find("static unsigned int tipc_poll(")
          if poll_start < 0:
              raise SystemExit("tipc_poll(): not found")
          poll_end = socket.find("\n}\n", poll_start)
          if poll_end < 0:
              raise SystemExit("tipc_poll(): end not found")
          poll_end += 3
          poll = socket[poll_start:poll_end]

          if "struct tipc_group *grp = tsk->group;" in poll:
              poll = poll.replace("\tstruct tipc_group *grp = tsk->group;\n", "", 1)
              changed = True

          old_poll_case = (
              "\tcase TIPC_OPEN:\n"
              "\t\tif (!grp || tipc_group_size(grp))\n"
              "\t\t\tif (!tsk->cong_link_cnt)\n"
              "\t\t\t\trevents |= POLLOUT;\n"
          )
          new_poll_case = (
              "\tcase TIPC_OPEN:\n"
              "\t\tif (READ_ONCE(tsk->group_is_open) && !tsk->cong_link_cnt)\n"
              "\t\t\trevents |= POLLOUT;\n"
          )
          if old_poll_case in poll:
              poll = poll.replace(old_poll_case, new_poll_case, 1)
              changed = True
          elif new_poll_case not in poll:
              raise SystemExit("tipc_poll(): expected readiness block not found")

          socket = socket[:poll_start] + poll + socket[poll_end:]

          old_call = "grp = tipc_group_create(net, tsk->portid, mreq);"
          new_call = (
              "grp = tipc_group_create(net, tsk->portid, mreq,\n"
              "\t\t\t\t&tsk->group_is_open);"
          )
          if old_call in socket:
              socket = socket.replace(old_call, new_call, 1)
              changed = True
          elif new_call not in socket:
              raise SystemExit("tipc_sk_join(): group create call not found")

          # Restore non-group readiness after a failed publish or a LEAVE.
          failed_join_old = (
              "\tif (rc) {\n"
              "\t\ttipc_group_delete(net, grp);\n"
              "\t\ttsk->group = NULL;\n"
              "\t}\n"
          )
          failed_join_new = (
              "\tif (rc) {\n"
              "\t\ttipc_group_delete(net, grp);\n"
              "\t\ttsk->group = NULL;\n"
              "\t\tWRITE_ONCE(tsk->group_is_open, true);\n"
              "\t}\n"
          )
          if failed_join_old in socket:
              socket = socket.replace(failed_join_old, failed_join_new, 1)
              changed = True
          elif failed_join_new not in socket:
              raise SystemExit("tipc_sk_join(): failed-publish cleanup block not found")

          leave_old = (
              "\ttipc_group_delete(net, grp);\n"
              "\ttsk->group = NULL;\n"
              "\ttipc_sk_withdraw(tsk, scope, &seq);\n"
          )
          leave_new = (
              "\ttipc_group_delete(net, grp);\n"
              "\ttsk->group = NULL;\n"
              "\tWRITE_ONCE(tsk->group_is_open, true);\n"
              "\ttipc_sk_withdraw(tsk, scope, &seq);\n"
          )
          if leave_old in socket:
              socket = socket.replace(leave_old, leave_new, 1)
              changed = True
          elif leave_new not in socket:
              raise SystemExit("tipc_sk_leave(): cleanup block not found")

          # -----------------------------------------------------------------
          # group.h / group.c: store readiness outside the freed group object.
          # -----------------------------------------------------------------

          old_decl = (
              "struct tipc_group *tipc_group_create(struct net *net, u32 portid,\n"
              "\t\t\t\t     struct tipc_group_req *mreq);"
          )
          new_decl = (
              "struct tipc_group *tipc_group_create(struct net *net, u32 portid,\n"
              "\t\t\t\t     struct tipc_group_req *mreq,\n"
              "\t\t\t\t     bool *group_is_open);"
          )
          if old_decl in header:
              header = header.replace(old_decl, new_decl, 1)
              changed = True
          elif new_decl not in header:
              raise SystemExit("group.h: tipc_group_create declaration not found")

          if "\tbool *open;\n" not in group:
              marker = "\tu16 bc_ackers;\n"
              if marker not in group:
                  raise SystemExit("group.c: tipc_group field anchor not found")
              group = group.replace(
                  marker,
                  marker + "\tbool *open;\t\t/* readiness lives in struct tipc_sock */\n",
                  1,
              )
              changed = True

          old_def = (
              "struct tipc_group *tipc_group_create(struct net *net, u32 portid,\n"
              "\t\t\t\t     struct tipc_group_req *mreq)"
          )
          new_def = (
              "struct tipc_group *tipc_group_create(struct net *net, u32 portid,\n"
              "\t\t\t\t     struct tipc_group_req *mreq,\n"
              "\t\t\t\t     bool *group_is_open)"
          )
          if old_def in group:
              group = group.replace(old_def, new_def, 1)
              changed = True
          elif new_def not in group:
              raise SystemExit("group.c: tipc_group_create definition not found")

          if "\tgrp->open = group_is_open;\n" not in group:
              anchor = "\tgrp->events = mreq->flags & TIPC_GROUP_MEMBER_EVTS;\n"
              if anchor not in group:
                  raise SystemExit("group.c: group flags anchor not found")
              group = group.replace(
                  anchor,
                  anchor + "\tgrp->open = group_is_open;\n",
                  1,
              )
              changed = True

          # Only mark the group closed after its kernel topology subscription
          # has actually been established; a failed create leaves a plain
          # non-group socket writable.
          sub_re = re.compile(
              r"(\tif \(tipc_topsrv_kern_subscr\([^\n]*\)\)\n)"
              r"(\t\treturn grp;)",
              re.M,
          )
          if "WRITE_ONCE(*grp->open, false);" not in group:
              m = sub_re.search(group)
              if not m:
                  raise SystemExit("group.c: topology subscription success block not found")
              repl = m.group(1) + "\t\tWRITE_ONCE(*grp->open, false);\n" + m.group(2)
              group = group[:m.start()] + repl + group[m.end():]
              changed = True

          # Existing remote member => preserve the old group_size()>0 poll rule.
          create_member_anchor = "\tgrp->member_cnt++;\n"
          if "WRITE_ONCE(*grp->open, true);" not in group:
              if create_member_anchor not in group:
                  raise SystemExit("group.c: member count increment not found")
              group = group.replace(
                  create_member_anchor,
                  create_member_anchor + "\tWRITE_ONCE(*grp->open, true);\n",
                  1,
              )
              changed = True

          delete_member_anchor = "\tgrp->member_cnt--;\n"
          delete_member_new = (
              "\tgrp->member_cnt--;\n"
              "\tif (!grp->member_cnt)\n"
              "\t\tWRITE_ONCE(*grp->open, false);\n"
          )
          if delete_member_new not in group:
              if delete_member_anchor not in group:
                  raise SystemExit("group.c: member count decrement not found")
              group = group.replace(delete_member_anchor, delete_member_new, 1)
              changed = True

          # A group being torn down must stop advertising writable state before
          # any member memory is released.
          delete_fn = "void tipc_group_delete(struct net *net, struct tipc_group *grp)\n{"
          delete_fn_new = (
              "void tipc_group_delete(struct net *net, struct tipc_group *grp)\n"
              "{\n"
              "\tWRITE_ONCE(*grp->open, false);"
          )
          if delete_fn_new not in group:
              if delete_fn not in group:
                  raise SystemExit("group.c: tipc_group_delete() anchor not found")
              group = group.replace(delete_fn, delete_fn_new, 1)
              changed = True

          socket_p.write_text(socket)
          group_p.write_text(group)
          header_p.write_text(header)

          print("custom_poll_hardening_changed=", changed)
          PY

          git diff -- net/tipc/socket.c net/tipc/group.c net/tipc/group.h

          if ! git diff --quiet; then
            git add net/tipc/socket.c net/tipc/group.c net/tipc/group.h
            git commit -m "tipc: harden group lifetime against poll and leave races

          Adapt upstream lifetime hardening to the pre-refactor communication
          groups implementation while preserving Sweet's lockless poll queue
          checks and the existing group-size readiness semantics.

          Inspired-by: 60c253069632 (tipc: fix race between poll() and setsockopt())
          Follow-up: 1b22bcad7e39 (tipc: correct initial value for group congestion flag)"
          fi

      - name: Static integrity verification
        shell: bash
        run: |
          set -euo pipefail

          git diff --check "${{ steps.baseline.outputs.base_sha }}..HEAD"

          if grep -RInE '^(<<<<<<<|=======|>>>>>>>)' net/tipc include/uapi/linux/tipc.h; then
            echo "::error::Conflict marker found"
            exit 1
          fi

          grep -Eq '^[[:space:]]*#define[[:space:]]+TIPC_GROUP_JOIN[[:space:]]+135' include/uapi/linux/tipc.h
          grep -Eq '^[[:space:]]*#define[[:space:]]+TIPC_GROUP_LEAVE[[:space:]]+136' include/uapi/linux/tipc.h
          grep -q 'struct tipc_group_req' include/uapi/linux/tipc.h
          grep -q 'group.o' net/tipc/Makefile

          grep -q 'bool group_is_open;' net/tipc/socket.c
          grep -q 'READ_ONCE(tsk->group_is_open)' net/tipc/socket.c
          grep -q 'WRITE_ONCE(tsk->group_is_open, true)' net/tipc/socket.c
          grep -q 'bool \*group_is_open' net/tipc/group.c
          grep -q 'WRITE_ONCE(\*grp->open, false)' net/tipc/group.c
          grep -q 'WRITE_ONCE(\*grp->open, true)' net/tipc/group.c

          # Sweet-specific newer queue safety must survive.
          grep -q 'skb_queue_empty_lockless' net/tipc/socket.c

          # The dangerous poll dereference must be gone specifically from poll().
          python3 - <<'PY'
          from pathlib import Path
          s = Path("net/tipc/socket.c").read_text()
          start = s.index("static unsigned int tipc_poll(")
          end = s.index("\n}\n", start)
          poll = s[start:end]
          forbidden = [
              "struct tipc_group *grp = tsk->group;",
              "tipc_group_size(grp)",
              "tipc_group_is_open(grp)",
          ]
          for item in forbidden:
              if item in poll:
                  raise SystemExit(f"Unsafe poll group dereference remains: {item}")
          if "skb_queue_empty_lockless" not in poll:
              raise SystemExit("Sweet lockless receive queue check was lost")
          if "READ_ONCE(tsk->group_is_open)" not in poll:
              raise SystemExit("Poll-safe group readiness flag is missing")
          print("tipc_poll lifetime audit: PASS")
          PY

          # 143ece / 3c6306 intent checks: group wait paths must test the live
          # tsk->group pointer, and broadcast destinations must be loaded after
          # the wait.
          grep -q 'tsk->group &&' net/tipc/socket.c
          grep -q 'tipc_group_bc_cong(tsk->group' net/tipc/socket.c

          {
            echo "=== static verification PASS ==="
            echo
            echo "HEAD=$(git rev-parse HEAD)"
            echo "BASE=${{ steps.baseline.outputs.base_sha }}"
            echo
            echo "=== commits added ==="
            git log --oneline "${{ steps.baseline.outputs.base_sha }}..HEAD"
            echo
            echo "=== diffstat ==="
            git diff --stat "${{ steps.baseline.outputs.base_sha }}..HEAD"
            echo
            echo "=== TIPC poll ==="
            sed -n '/static unsigned int tipc_poll(/,/^}/p' net/tipc/socket.c
          } > static-verification.txt

      - name: Verify stable was not touched
        shell: bash
        run: |
          set -euo pipefail

          git fetch --no-tags origin stable
          STABLE_NOW="$(git rev-parse refs/remotes/origin/stable)"
          STABLE_BEFORE="${{ steps.baseline.outputs.stable_before }}"

          if [[ "$STABLE_NOW" != "$STABLE_BEFORE" ]]; then
            echo "::error::origin/stable changed during this run. Refusing to push anything."
            echo "before=$STABLE_BEFORE"
            echo "now=$STABLE_NOW"
            exit 1
          fi

          echo "stable unchanged: $STABLE_NOW"

      - name: Final report
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "TIPC GROUPS HARDENING REPORT"
            echo "repository=$GITHUB_REPOSITORY"
            echo "branch=$TARGET_BRANCH"
            echo "base=${{ steps.baseline.outputs.base_sha }}"
            echo "final=$(git rev-parse HEAD)"
            echo "stable=${{ steps.baseline.outputs.stable_before }}"
            echo "build=NOT_RUN_BY_THIS_WORKFLOW"
            echo
            echo
            echo "=== upstream fixes ==="
            cat applied-upstream-fixes.txt
            echo
            echo "=== commits ==="
            git log --oneline "${{ steps.baseline.outputs.base_sha }}..HEAD"
            echo
            echo "=== diffstat ==="
            git diff --stat "${{ steps.baseline.outputs.base_sha }}..HEAD"
            echo
            echo "=== critical assertions ==="
            grep -nE 'TIPC_GROUP_(JOIN|LEAVE)|struct tipc_group_req' include/uapi/linux/tipc.h
            grep -n 'group_is_open' net/tipc/socket.c
            grep -n 'group_is_open\|grp->open' net/tipc/group.c
            echo
            echo "=== git status ==="
            git status --short
          } | tee tipc-hardening-report.txt

      - name: Upload audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tipc-groups-hardening-report
          if-no-files-found: error
          retention-days: 14
          path: |
            baseline-report.txt
            applied-upstream-fixes.txt
            static-verification.txt
            tipc-hardening-report.txt

      - name: Push verified commits to TIPC_GROUPS only
        if: ${{ inputs.push_changes }}
        shell: bash
        run: |
          set -euo pipefail

          CURRENT_BRANCH="$(git branch --show-current)"
          if [[ "$CURRENT_BRANCH" != "$TARGET_BRANCH" ]]; then
            echo "::error::Branch changed unexpectedly. Refusing push."
            exit 1
          fi

          # Explicit refspec: this workflow has no code path that writes stable.
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"

          git fetch --no-tags origin stable "$TARGET_BRANCH"

          REMOTE_TIPC="$(git rev-parse "refs/remotes/origin/$TARGET_BRANCH")"
          LOCAL_HEAD="$(git rev-parse HEAD)"
          REMOTE_STABLE="$(git rev-parse refs/remotes/origin/stable)"

          [[ "$REMOTE_TIPC" == "$LOCAL_HEAD" ]] || {
            echo "::error::Remote TIPC_GROUPS did not land on verified HEAD"
            exit 1
          }

          [[ "$REMOTE_STABLE" == "${{ steps.baseline.outputs.stable_before }}" ]] || {
            echo "::error::stable changed unexpectedly"
            exit 1
          }

          echo "PUSH_OK=$REMOTE_TIPC"
          echo "STABLE_UNCHANGED=$REMOTE_STABLE"
