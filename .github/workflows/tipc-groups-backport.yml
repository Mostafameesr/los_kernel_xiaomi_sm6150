name: TIPC Groups Backport

on:
  push:
    branches:
      - TIPC_GROUPS
    paths:
      - .github/workflows/tipc-groups-backport.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backport:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: TIPC_GROUPS
          fetch-depth: 0

      - name: Apply upstream TIPC communication groups series
        shell: bash
        run: |
          set -euo pipefail

          BASE_SHA="$(git rev-parse HEAD)"
          START_SHA="14c04493cb77bc38404dbcb39d5ccbb667831ad7"
          END_SHA="04d7b574b245c66001a33cb9da2c0311063af73f"
          MEMBER_EVT_SHA="ae236fb208a6fbbd2e7a6913385e8fb78ac807f8"

          # cb4dc41 is intentionally omitted.
          # Sweet 4.14.357 already carries the newer
          # skb_queue_empty_lockless() form of the same tipc_poll() race fix.
          FIXES=(
            36c0a9dfc6613242ba1de012e2d15145cdaae805
            e233df01576bba9f5bafacccd571353b72152bd5
            e0e853ac036f76fcad3995554b8b6cef555b010f
            2e724dca7749223204bbae21745c0e3fc932700a
            672ecbe1c977616aa720c9397589665b33e72610
          )

          git config user.name "DNA TIPC Backport"
          git config user.email "tipc-backport@users.noreply.github.com"

          git remote remove linux-upstream 2>/dev/null || true
          git remote add linux-upstream https://github.com/torvalds/linux.git

          rm -f /tmp/tipc-backport-report.txt /tmp/tipc-conflicts.diff

          {
            echo "base_sha=$BASE_SHA"
            echo "branch=$(git branch --show-current)"
            echo "kernel=$(grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL) =' Makefile | tr '\n' ' ')"
            echo "cb4dc41_status=superseded_by_Sweet_skb_queue_empty_lockless"
          } | tee /tmp/tipc-backport-report.txt

          git fetch --no-tags linux-upstream "$END_SHA"

          if ! git cat-file -e "$START_SHA^{commit}" 2>/dev/null; then
            git fetch --no-tags --deepen=512 linux-upstream "$END_SHA"
          fi

          for fix in "${FIXES[@]}"; do
            git fetch --no-tags linux-upstream "$fix"
          done

          set +e
          git cherry-pick "$START_SHA^..$END_SHA"
          rc=$?
          set -e

          if [ "$rc" -ne 0 ]; then
            current="$(git rev-parse CHERRY_PICK_HEAD 2>/dev/null || true)"
            unmerged="$(git diff --name-only --diff-filter=U || true)"

            if [ "$current" = "$MEMBER_EVT_SHA" ] &&                [ "$unmerged" = "net/tipc/socket.c" ]; then

              echo "Resolving ae236fb while preserving Sweet lockless poll fix"                 | tee -a /tmp/tipc-backport-report.txt

              python3 - <<'PY'
          from pathlib import Path

          p = Path("net/tipc/socket.c")
          s = p.read_text()

          start = s.index("static unsigned int tipc_poll(")
          end = s.index("/**\n * tipc_sendmcast", start)

          fn = r'''static unsigned int tipc_poll(struct file *file, struct socket *sock,
          			      poll_table *wait)
          {
          	struct sock *sk = sock->sk;
          	struct tipc_sock *tsk = tipc_sk(sk);
          	struct tipc_group *grp = tsk->group;
          	u32 revents = 0;

          	sock_poll_wait(file, sk_sleep(sk), wait);

          	if (sk->sk_shutdown & RCV_SHUTDOWN)
          		revents |= POLLRDHUP | POLLIN | POLLRDNORM;
          	if (sk->sk_shutdown == SHUTDOWN_MASK)
          		revents |= POLLHUP;

          	switch (sk->sk_state) {
          	case TIPC_ESTABLISHED:
          		if (!tsk->cong_link_cnt && !tsk_conn_cong(tsk))
          			revents |= POLLOUT;
          		/* fall thru' */
          	case TIPC_LISTEN:
          	case TIPC_CONNECTING:
          		if (!skb_queue_empty_lockless(&sk->sk_receive_queue))
          			revents |= POLLIN | POLLRDNORM;
          		break;
          	case TIPC_OPEN:
          		if (!grp || tipc_group_size(grp))
          			if (!tsk->cong_link_cnt)
          				revents |= POLLOUT;

          		if (tipc_sk_type_connectionless(sk) &&
          		    !skb_queue_empty_lockless(&sk->sk_receive_queue))
          			revents |= POLLIN | POLLRDNORM;
          		break;
          	case TIPC_DISCONNECTING:
          		revents = POLLIN | POLLRDNORM | POLLHUP;
          		break;
          	}

          	return revents;
          }

          '''

          p.write_text(s[:start] + fn + s[end:])
          PY

              git add net/tipc/socket.c

              set +e
              GIT_EDITOR=true git cherry-pick --continue
              rc=$?
              set -e
            fi
          fi

          if [ "$rc" -ne 0 ]; then
            {
              echo "stage=base_series"
              echo "result=conflict"
              echo "cherry_pick_head=$(git rev-parse CHERRY_PICK_HEAD 2>/dev/null || true)"
              echo "--- status ---"
              git status --short
              echo "--- unmerged ---"
              git diff --name-only --diff-filter=U
            } | tee -a /tmp/tipc-backport-report.txt

            git diff > /tmp/tipc-conflicts.diff || true
            exit 20
          fi

          for fix in "${FIXES[@]}"; do
            set +e
            git cherry-pick "$fix"
            rc=$?
            set -e

            if [ "$rc" -ne 0 ]; then
              {
                echo "stage=fix:$fix"
                echo "result=conflict"
                echo "cherry_pick_head=$(git rev-parse CHERRY_PICK_HEAD 2>/dev/null || true)"
                echo "--- status ---"
                git status --short
                echo "--- unmerged ---"
                git diff --name-only --diff-filter=U
              } | tee -a /tmp/tipc-backport-report.txt

              git diff > /tmp/tipc-conflicts.diff || true
              exit 21
            fi
          done

          {
            echo "result=clean"
            echo "head=$(git rev-parse HEAD)"

            echo "--- ABI ---"
            grep -n "TIPC_GROUP_JOIN" include/uapi/linux/tipc.h
            grep -n "TIPC_GROUP_LEAVE" include/uapi/linux/tipc.h
            grep -n "struct tipc_group_req" include/uapi/linux/tipc.h

            echo "--- implementation ---"
            test -f net/tipc/group.c && echo "group.c=present"
            test -f net/tipc/group.h && echo "group.h=present"
            grep -n "group.o" net/tipc/Makefile
            grep -n "case TIPC_GROUP_JOIN" net/tipc/socket.c
            grep -n "tipc_send_group_bcast" net/tipc/socket.c | head

            echo "--- Sweet poll fix preserved ---"
            grep -n "skb_queue_empty_lockless" net/tipc/socket.c | head

            echo "--- diff stat ---"
            git diff --stat "$BASE_SHA..HEAD"
          } | tee -a /tmp/tipc-backport-report.txt

          git push origin HEAD:TIPC_GROUPS

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tipc-groups-backport-report
          if-no-files-found: ignore
          path: |
            /tmp/tipc-backport-report.txt
            /tmp/tipc-conflicts.diff
